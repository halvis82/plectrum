name: yt-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: denoland/setup-deno@v2
      - run: pip install -U "yt-dlp[default]"
      - run: |
          for id in bx1Bh8ZvH84 JGwWNGJdvx8 hLQl3WQQoQ0 fJ9rUzIMcZQ; do
            yt-dlp -f bestaudio -o "$id.%(ext)s" --no-progress "https://www.youtube.com/watch?v=$id" 2>&1 | tail -3
          done
          ls -la
